<div class="aside" id="kt_aside" [class.collapsed]="isCollapsed" data-kt-drawer="true" data-kt-drawer-activate="{default: true, lg: false}" data-kt-drawer-direction="start">
  <!-- Logo -->
  <div class="aside-logo flex-column-auto px-10 pt-9 pb-5" id="kt_aside_logo">
    <a href="/dashboard">
      <img [src]="isDarkMode ? '/assets/media/publics/logo/logo_dark.svg' : '/assets/media/publics/logo/logo_light.svg'"
           alt="Logo"
           class="max-h-50px logo-default"
           [class.theme-light-show]="!isDarkMode"
           [class.theme-dark-show]="isDarkMode" />
    </a>
  </div>

  <!-- Menu -->
  <div class="aside-menu flex-column-fluid ps-3 pe-1">
    <div class="menu menu-sub-indention menu-column menu-rounded menu-title-gray-600 menu-icon-gray-400 menu-active-bg menu-state-primary menu-arrow-gray-500 fw-semibold fs-6 my-5 mt-lg-2 mb-lg-0">
      <div class="hover-scroll-y mx-4">

        <!-- Accueil -->
        <div class="menu-item">
          <a class="menu-link" routerLink="/dashboard" routerLinkActive="active">
            <span class="menu-icon">
              <i class="ki-duotone ki-home fs-2">
                <span class="path1"></span>
                <span class="path2"></span>
              </i>
            </span>
            <span class="menu-title">Accueil</span>
          </a>
        </div>

        <!-- Dashboard Menu Item -->
        <div class="menu-item menu-accordion" [class.show]="isDashboardExpanded">

          <span class="menu-link" (click)="toggleDashboard()">
            <span class="menu-icon">
              <i class="ki-duotone ki-element-11 fs-2">
                <span class="path1"></span>
                <span class="path2"></span>
                <span class="path3"></span>
                <span class="path4"></span>
              </i>
            </span>
            <a class="menu-link" routerLink="/dashboard" routerLinkActive="active">
            <span class="menu-title">Tableau de bord</span>
            <span class="menu-arrow"></span>
            </a>
          </span>

          <!-- Submenu -->
          <div class="menu-sub menu-sub-accordion" [@submenuAnimation]="isDashboardExpanded ? 'expanded' : 'collapsed'">
            <div class="menu-item">
              <a class="menu-link" routerLink="/cartes" routerLinkActive="active">
                <span class="menu-bullet"><span class="bullet bullet-dot"></span></span>
                <span class="menu-title">Cartes en temps réel</span>
              </a>
            </div>

            <div class="menu-item">
              <a class="menu-link" routerLink="/users" routerLinkActive="active">
                <span class="menu-bullet"><span class="bullet bullet-dot"></span></span>
                <span class="menu-title">Utilisateurs</span>
              </a>
            </div>

            <div class="menu-item">
              <a class="menu-link" routerLink="/tickets" routerLinkActive="active">
                <span class="menu-bullet"><span class="bullet bullet-dot"></span></span>
                <span class="menu-title">Tickets & Chats</span>
              </a>
            </div>

            <div class="menu-item">
              <a class="menu-link" routerLink="/assureurs" routerLinkActive="active">
                <span class="menu-bullet"><span class="bullet bullet-dot"></span></span>
                <span class="menu-title">Assureurs</span>
              </a>
            </div>

            <div class="menu-item">
              <a class="menu-link" routerLink="/statistiques" routerLinkActive="active">
                <span class="menu-bullet"><span class="bullet bullet-dot"></span></span>
                <span class="menu-title">Statistiques</span>

              </a>
            </div>
            <div class="menu-item">
              <a class="menu-link" routerLink="/settings" routerLinkActive="active">
                <span class="menu-bullet"><span class="bullet bullet-dot"></span></span>
                <span class="menu-title">Paramètres</span>
              </a>
            </div>
            <!--<div class="menu-item">
              <a class="menu-link" routerLink="/settings" routerLinkActive="active">
                <span class="menu-bullet"><span class="bullet bullet-dot"></span></span>
                <span class="menu-title">Paramètres</span>
              </a>
            </div>-->

            </div>

          </div>
        </div>



        <!-- Separator -->
        <div class="menu-item">
          <div class="menu-content">
            <div class="separator mx-1 my-4"></div>
          </div>
        </div>

        <!-- Déconnexion -->
        <div class="menu-item">
          <a class="menu-link" (click)="deconnexion()">
            <span class="menu-icon">
              <i class="ki-duotone ki-logout fs-2">
                <span class="path1"></span>
                <span class="path2"></span>
              </i>
            </span>
            <span class="menu-title">Déconnexion</span>
          </a>
        </div>
      </div>
    </div>
  </div>
