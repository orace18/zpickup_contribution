<button
      [disabled]="isLoading"
      [ngClass]="buttonClass"
      class="relative"
      (click)="onClick()"
    >
      <span *ngIf="!isLoading">{{ label }}</span>
      <div *ngIf="isLoading" class="flex items-center justify-center">
        <div class="spinner-wrapper">
          <svg class="spinner" viewBox="0 0 50 50">
            <circle
              class="path"
              cx="25"
              cy="25"
              r="20"
              fill="none"
              stroke-width="4"
            ></circle>
          </svg>
        </div>
        <span class="ml-2">{{ loadingText }}</span>
      </div>
    </button>
