<ngx-charts-line-chart
      [view]="[400, 400]"
      [results]="chartData"
      [xAxis]="true"
      [yAxis]="true"
      [legend]="false"
      [showXAxisLabel]="true"
      [showYAxisLabel]="true"
      [xAxisLabel]="xLabel"
      [yAxisLabel]="yLabel"
      [customColors]="customColors"

    >
    </ngx-charts-line-chart>
