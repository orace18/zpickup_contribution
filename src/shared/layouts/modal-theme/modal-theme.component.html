<div class="d-flex align-items-center ms-1 ms-lg-2 mt-2">
  <a href="#"
     class="btn btn-icon btn-active-light-primary w-30px h-30px w-md-40px h-md-40px"
     (click)="toggleMenu($event)">
      <i class="ki-duotone ki-night-day theme-light-show fs-1" [style.display]="currentTheme !== 'dark' ? 'inline' : 'none'">
          <span class="path1"></span>
          <span class="path2"></span>
          <span class="path3"></span>
          <span class="path4"></span>
          <span class="path5"></span>
          <span class="path6"></span>
          <span class="path7"></span>
          <span class="path8"></span>
          <span class="path9"></span>
          <span class="path10"></span>
      </i>
      <i class="ki-duotone ki-moon theme-dark-show fs-1" [style.display]="currentTheme === 'dark' ? 'inline' : 'none'">
          <span class="path1"></span>
          <span class="path2"></span>
      </i>
  </a>

  <div class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-title-gray-700 menu-icon-gray-500 menu-active-bg menu-state-color fw-semibold py-4 fs-base w-150px"
       [class.show]="isMenuOpen">
      <div class="menu-item px-3 my-0">
          <a href="#" 
             class="menu-link px-3 py-2"
             [class.active]="currentTheme === 'light'"
             (click)="setTheme($event, 'light')">
              <span class="menu-icon">
                  <i class="ki-duotone ki-night-day fs-2">
                      <span class="path1"></span>
                      <span class="path2"></span>
                      <span class="path3"></span>
                      <span class="path4"></span>
                      <span class="path5"></span>
                      <span class="path6"></span>
                      <span class="path7"></span>
                      <span class="path8"></span>
                      <span class="path9"></span>
                      <span class="path10"></span>
                  </i>
              </span>
              <span class="menu-title">Clair</span>
          </a>
      </div>

      <div class="menu-item px-3 my-0">
          <a href="#" 
             class="menu-link px-3 py-2"
             [class.active]="currentTheme === 'dark'"
             (click)="setTheme($event, 'dark')">
              <span class="menu-icon">
                  <i class="ki-duotone ki-moon fs-2">
                      <span class="path1"></span>
                      <span class="path2"></span>
                  </i>
              </span>
              <span class="menu-title">Sombre</span>
          </a>
      </div>

      <div class="menu-item px-3 my-0">
          <a href="#" 
             class="menu-link px-3 py-2"
             [class.active]="currentTheme === 'system'"
             (click)="setTheme($event, 'system')">
              <span class="menu-icon">
                  <i class="ki-duotone ki-screen fs-2">
                      <span class="path1"></span>
                      <span class="path2"></span>
                      <span class="path3"></span>
                      <span class="path4"></span>
                  </i>
              </span>
              <span class="menu-title">Systeme</span>
          </a>
      </div>
  </div>
</div>
