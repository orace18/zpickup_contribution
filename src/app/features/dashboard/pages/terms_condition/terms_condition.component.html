<div class="container mx-auto p-4">
    <form *ngIf="termsCondition" (ngSubmit)="onSubmit()" class="mb-4" #policyForm="ngForm">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white p-4">
          <h2 class="m-0">Termes et Conditions d'utilisations</h2>
        </div>
        
        <div class="card-body p-4">
          <div class="mb-4">
            <label for="title" class="form-label font-weight-bold">Titre *</label>
            <input 
              type="text" 
              id="title"
              name="title"
              [(ngModel)]="termsCondition.title"
              class="form-control"
              placeholder="Entrez le titre"
              required
              #titleField="ngModel"
            >
            <div *ngIf="titleField.invalid && (titleField.dirty || titleField.touched)" class="text-danger mt-1">
              Le titre est obligatoire
            </div>
          </div>
  
          <div class="mb-4">
            <label class="form-label font-weight-bold">Description *</label>
            <editor
              [(ngModel)]="termsCondition.description"
              [init]="editorConfig"
              (onInit)="onEditorInit()"
              required
              name="description"
              #descriptionField="ngModel">
            </editor>
            <div *ngIf="descriptionField.invalid && (descriptionField.dirty || descriptionField.touched)" class="text-danger mt-1">
              La description est obligatoire
            </div>
          </div>
  
          <div class="mt-4 d-flex justify-content-end gap-2">
            <button 
              type="button" 
              class="btn btn-secondary" 
              (click)="onReset()">
              Annuler
            </button>
            <button 
              type="submit" 
              class="btn btn-primary"
              [disabled]="isSaving || policyForm.invalid">
              {{ isSaving ? 'Enregistrement...' : 'Enregistrer' }}
            </button>
          </div>
        </div>
      </div>
    </form>
  
    <div *ngIf="error" class="alert alert-danger mt-3">
      {{ error }}
    </div>
  
    <div *ngIf="successMessage" class="alert alert-success mt-3">
      {{ successMessage }}
    </div>
  </div>
