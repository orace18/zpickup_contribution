<div class="container mt-4">
    <h2 class="mb-4">Historique des Courses</h2>
  
    <div *ngIf="isLoading" class="text-center">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Chargement...</span>
      </div>
    </div>
  
    <div *ngIf="error" class="alert alert-danger">
      {{ error }}
    </div>
  
    <table *ngIf="!isLoading && !error" class="table table-striped table-hover">
      <thead class="table-light">
        <tr>
          <th>Référence</th>
          <th>Statut</th>
          <th>Rue</th>
          <th>Localité</th>
          <th>Pays</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let history of raceHistories; let i = index">
          <td>{{ i + 1 }}</td>
          <td>
            <span class="badge" 
                  [ngClass]="{
                    'badge-light-success': history.status === 'accepted', 
                    'badge-light-warning': history.status === 'pending',
                    'badge-light-danger': history.status === 'rejected'
                  }">
              {{ getLabel(history.status) }}
            </span>
          </td>
          <td>{{ history.street }}</td>
          <td>{{ history.locality }}</td>
          <td>{{ history.country }}</td>
          <td>
            <button class="btn btn-primary btn-sm" (click)="voirDetails(history)">
              Détails
              <i class="bi bi-info-circle ms-1"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  
    <p *ngIf="!isLoading && raceHistories.length === 0" class="alert alert-info">
      Aucun historique de course trouvé.
    </p>
  </div>
