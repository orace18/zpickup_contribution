<div class="container-fluid p-4">
    <div class="mb-4 d-flex justify-content-between align-items-center">
        <div class="mb-0"></div>
        <div class="d-flex gap-3">
        <button class="btn btn-primary" >
          <i class="bi bi-calendar me-2"></i>
          Filtrer
        </button>
        <div class="dropdown">
          <button class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown">
            <i class="bi bi-download me-2"></i>
            Exporter
          </button>
          <ul class="dropdown-menu">
            <!-- (click)="openModal()"<li><a class="dropdown-item" (click)="exportToCsv()"><i class="bi bi-filetype-csv me-2"></i>CSV</a></li>
            <li><a class="dropdown-item" (click)="exportToPdf()"><i class="bi bi-filetype-pdf me-2"></i>PDF</a></li>
            <li><a class="dropdown-item" (click)="exportToExcel()"><i class="bi bi-file-excel me-2"></i>Excel</a></li>
           --></ul>
        </div>
      </div>
    </div>
    <div class="row g-4 mb-5">
      <div class="col-md-4" *ngFor="let card of cards">
        <div class="card shadow-sm">
          <div class="card-body d-flex align-items-center">
            <div class="me-4">
              <span class="svg-icon svg-icon-3x" [ngClass]="'svg-icon-' + card.color">
                <i [ngClass]="'ki-duotone ki-' + card.icon + ' fs-2x text-' + card.color">
                  <span class="path1"></span>
                  <span class="path2"></span>
                </i>
              </span>
            </div>
            <div>
              <div class="fs-4 fw-bold text-gray-900 mb-2">{{ card.title }}</div>
              <div [ngClass]="'fs-2 fw-bolder text-' + card.color">{{ card.amount }} FCFA</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">Détails Financiers</h3>
      </div>
      <div class="card-body">
        <p-table [value]="financialData" responsiveLayout="scroll">
          <ng-template pTemplate="header">
            <tr>
              <th>Date</th>
              <th>Type</th>
              <th>Montant</th>
              <th>Statut</th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-item>
            <tr>
              <td>{{ item.date | date:'dd/MM/yyyy' }}</td>
              <td>{{ item.type }}</td>
              <td>{{ item.amount }} FCFA</td>
              <td>{{ item.status }}</td>
            </tr>
          </ng-template>
        </p-table>
      </div>
    </div>
  </div>
