<div class="d-flex flex-column flex-root">
  <!--begin::Authentication - Sign-in -->
  <div class="d-flex flex-column flex-lg-row flex-column-fluid">
    <!--begin::Aside-->
    <div class="d-flex flex-column flex-lg-row-auto bg-primary min-w-lg-450px">
      <!--begin::Wrapper-->
      <div class="d-flex flex-column position-relative w-100 pt-5 px-4 px-lg-8">
        <!--begin::Header-->
        <div class="d-flex flex-row-fluid flex-column text-center">
          <!--begin::Logo-->
          <a href="/login" class="py-2 py-lg-6 mb-4">
            <img alt="Logo" src="../assets/media/publics/logo/logo_dark.svg" class="h-clamp-60"/>
          </a>
          <!--end::Logo-->

          <!--begin::Title-->
          <h1 class="d-none d-lg-block fw-bold text-white fs-clamp mb-5">
            Bienvenue sur ZpickUp
          </h1>
          <!--end::Title-->

          <!--begin::Description-->
          <p class="d-none d-lg-block fw-semibold fs-clamp-text text-white">
            Connectez vous pour gérer <br/>
            la partie administrative de ZpickUp
          </p>
          <!--end::Description-->
        </div>
        <!--end::Header-->

        <!--begin::Illustration-->
        <div class="d-none d-lg-block illustration-container" 
             style="background-image: url('../assets/media/illustrations/sigma-1/17.png')">
        </div>
        <!--end::Illustration-->
      </div>
      <!--end::Wrapper-->
    </div>
    <!--begin::Aside-->

    <!--begin::Body-->
    <div class="d-flex flex-column flex-lg-row-fluid py-10 px-4 px-lg-8">
      <!--begin::Content-->
      <div class="d-flex flex-center flex-column flex-column-fluid">
        <!--begin::Wrapper-->
        <div class="w-100 max-w-md p-4 p-lg-8 mx-auto">
          <!--begin::Form-->
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="form w-100" novalidate="novalidate">
            <div *ngIf="formError" class="alert alert-danger mb-5">
              {{ formError }}
            </div>
            <!--begin::Heading-->
            <div class="text-center mb-8">
              <!--begin::Title-->
              <h1 class="text-dark fs-clamp-title mb-3">
                Se connecter       
              </h1>
              <!--end::Title-->
            </div>
            <!--begin::Heading-->

            <!--begin::Input group-->
            <div class="fv-row mb-8">
              <label class="form-label fs-clamp-label fw-bold text-dark">Email</label>
              <input
                class="form-control form-control-lg form-control-solid h-auto py-clamp px-6"
                type="email_address"
                formControlName="email_address"
                [ngClass]="{'is-invalid': showError('email_address')}"
              />
              <div *ngIf="showError('email_address')" class="invalid-feedback fs-clamp-error">
                <div *ngIf="loginForm.get('email_address')?.errors?.['required']">Email est requis</div>
                <div *ngIf="loginForm.get('email_address')?.errors?.['email']">Veuillez entrer un Email valide</div>
              </div>
            </div>
            <!--end::Input group-->

            <!--begin::Input group-->
            <div class="fv-row mb-8">
              <div class="d-flex flex-stack mb-2">
                <label class="form-label fw-bold text-dark fs-clamp-label mb-0">Mot de passe</label>
                <a routerLink="/password-reset" class="link-primary fs-clamp-small fw-bold">Mot de passe oublié ?</a>
              </div>
              <div class="position-relative">
                <input
                  [type]="showPassword ? 'text' : 'password'"
                  class="form-control form-control-lg form-control-solid h-auto py-clamp px-6"
                  formControlName="password"
                  [ngClass]="{'is-invalid': showError('password')}"
                />
                <span class="btn btn-sm btn-icon position-absolute translate-middle-y top-50 end-0 me-2"
                      (click)="showPassword = !showPassword">
                  <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                </span>
              </div>
              <div *ngIf="showError('password')" class="invalid-feedback fs-clamp-error">
                <div *ngIf="loginForm.get('password')?.errors?.['required']">Mot de passe est requis</div>
                <div *ngIf="loginForm.get('password')?.errors?.['minlength']">Mot de passe doit avoir minimum 6 caractères</div>
              </div>
            </div>
            <!--end::Input group-->

            <!--begin::Actions-->
            <div class="text-center">
              <app-animatebutton
                [isLoading]="isSubmitting"
                label="Se connecter"
                loadingText="Veuillez patientez"
                buttonClass="btn btn-lg btn-primary w-100 mb-5"
              ></app-animatebutton>
            </div>
            <!--end::Actions-->
          </form>
          <!--end::Form-->
        </div>
        <!--end::Wrapper-->
      </div>
      <!--end::Content-->
    </div>
    <!--end::Body-->
  </div>
  <!--end::Authentication - Sign-in -->
</div>
