<div class="d-flex flex-column flex-root">
  <!--begin::Authentication - Sign-in -->
  <div class="d-flex flex-column flex-lg-row flex-column-fluid">
    <!--begin::Aside-->
    <div class="d-flex flex-column flex-lg-row-auto bg-primary w-xl-600px positon-xl-relative">
      <!--begin::Wrapper-->
      <div class="d-flex flex-column position-xl-fixed top-0 bottom-0 w-xl-600px scroll-y">
        <!--begin::Header-->
        <div class="d-flex flex-row-fluid flex-column text-center p-5 p-lg-10 pt-lg-20">
          <!--begin::Logo-->
          <a href="/login" class="py-2 py-lg-20">
            <img alt="Logo" src="../assets/media/publics/logo/logo_dark.svg" class="h-60px h-lg-70px"/>
          </a>
          <!--end::Logo-->

          <!--begin::Title-->
          <h1 class="d-none d-lg-block fw-bold text-white fs-2qx pb-5 pb-md-10">
            Bienvenue sur ZpickUp
          </h1>
          <!--end::Title-->

          <!--begin::Description-->
          <p class="d-none d-lg-block fw-semibold fs-2 text-white">
            Connectez vous pour gérer <br/>
            la partie administrative de ZpickUp
          </p>
          <!--end::Description-->
        </div>
        <!--end::Header-->

        <!--begin::Illustration-->
        <div class="d-none d-lg-block d-flex flex-row-auto bgi-no-repeat bgi-position-x-center bgi-size-contain bgi-position-y-bottom min-h-100px min-h-lg-350px"
         id="bas-page"    style="background-image: url('../assets/media/illustrations/sigma-1/17.png')">
        </div>
        <!--end::Illustration-->
      </div>
      <!--end::Wrapper-->
    </div>
    <!--begin::Aside-->

    <!--begin::Body-->
    <div class="d-flex flex-column flex-lg-row-fluid py-10">
      <!--begin::Content-->
      <div class="d-flex flex-center flex-column flex-column-fluid">
        <!--begin::Wrapper-->
        <div class="w-lg-500px p-10 p-lg-15 mx-auto">

          <!--begin::Form-->
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="form w-100" novalidate="novalidate" id="kt_sign_in_form" data-kt-redirect-url="/craft/index.html" action="#">
            <div *ngIf="formError" class="alert alert-danger mb-5">
              {{ formError }}
            </div>
            <!--begin::Heading-->
            <div class="text-center mb-10">
              <!--begin::Title-->
              <h1 class="text-dark mb-3">
                Se connecter       
              </h1>
              <!--end::Title-->
            </div>
            <!--begin::Heading-->

            <!--begin::Input group-->
            <div class="fv-row mb-10">
              <label class="form-label fs-6 fw-bold text-dark">Email</label>
              <input
                class="form-control form-control-lg form-control-solid"
                type="email_address"
                formControlName="email_address"
                [ngClass]="{'is-invalid': showError('email_address')}"
              />
              <div *ngIf="showError('email_address')" class="invalid-feedback">
                <div *ngIf="loginForm.get('email_address')?.errors?.['required']">Email est requis</div>
                <div *ngIf="loginForm.get('email_address')?.errors?.['email']">Veuillez entrer un Email valide</div>
              </div>
            </div>
            <!--end::Input group-->

            <!--begin::Input group-->
            <div class="fv-row mb-10">
              <div class="d-flex flex-stack mb-2">
                <label class="form-label fw-bold text-dark fs-6 mb-0">Mot de passe</label>
              </div>
              <div class="position-relative">
                <input
                  [type]="showPassword ? 'text' : 'password'"
                  class="form-control form-control-lg form-control-solid"
                  formControlName="password"
                  [ngClass]="{'is-invalid': showError('password')}"
                />
                <span class="btn btn-sm btn-icon position-absolute translate-middle-y top-50 end-0"
                      (click)="showPassword = !showPassword">
                  <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                </span>
              </div>
              <div *ngIf="showError('password')" class="invalid-feedback">
                <div *ngIf="loginForm.get('password')?.errors?.['required']">Mot de passe est requis</div>
                <div *ngIf="loginForm.get('password')?.errors?.['minlength']">Mot de passe doit avoir minimum 6 caractères</div>
              </div>
              <div class="d-flex justify-content-end mt-2">
                <a routerLink="/password-reset" class="link-primary fs-6 fw-bold">Mot de passe oublié ?</a>
              </div>
            </div>
            <!--end::Input group-->

            <!--begin::Actions-->
            <div class="text-center">
              <!--begin::Submit button-->
              <button
                type="submit"
                class="btn btn-lg btn-primary w-100 mb-5">
                <span class="indicator-label" *ngIf="!isSubmitting">Se connecter</span>
                <span class="indicator-progress" *ngIf="isSubmitting">
                  Veuillez patientez <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                </span>
              </button>
              <!--end::Submit button-->
            </div>
            <!--end::Actions-->
          </form>
          <!--end::Form-->
        </div>
        <!--end::Wrapper-->
      </div>
      <!--end::Content-->

      <!--begin::Footer-->
      <div class="d-flex flex-center flex-wrap fs-6 p-5 pb-0">
        <!--begin::Links-->
        <div class="d-flex flex-center fw-semibold fs-6">
          <a href="https://keenthemes.com/" class="text-muted text-hover-primary px-2" target="_blank">About</a>
          <a href="https://devs.keenthemes.com/" class="text-muted text-hover-primary px-2" target="_blank">Support</a>
          <a href="https://themes.getbootstrap.com/product/craft-bootstrap-5-admin-dashboard-theme" class="text-muted text-hover-primary px-2" target="_blank">Purchase</a>
        </div>
        <!--end::Links-->
      </div>
      <!--end::Footer-->
    </div>
    <!--end::Body-->
  </div>
  <!--end::Authentication - Sign-in-->
</div>
