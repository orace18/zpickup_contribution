<div class="map-container">
  <mat-tab-group (selectedTabChange)="onTabChange($event)">
    <mat-tab label="Toutes les courses">
      <div class="map-container">
        <!-- <div class="status-legend">
          <mat-chip-listbox>
            <mat-chip color="primary">En attente: {{getPendingCount()}}</mat-chip>
            <mat-chip color="accent">En cours: {{getStartedCount()}}</mat-chip>
            <mat-chip color="warn">Terminées: {{getCompletedCount()}}</mat-chip>
            <mat-chip>Annulées: {{getCanceledCount()}}</mat-chip>
          </mat-chip-listbox>
        </div> -->
        <google-map
          #allMap
          height="100vh"
          width="100%"
          [center]="center"
          [zoom]="zoom">
        </google-map>
      </div>
    </mat-tab>
  
    <mat-tab label="En attente ({{getPendingCount()}})">
      <div class="map-container">
        <google-map
          #pendingMap
          height="100vh"
          width="100%"
          [center]="center"
          [zoom]="zoom">
        </google-map>
      </div>
    </mat-tab>
  
    <mat-tab label="En cours ({{getStartedCount()}})">
      <div class="map-container">
        <google-map
          #startedMap
          height="100vh"
          width="100%"
          [center]="center"
          [zoom]="zoom">
        </google-map>
      </div>
    </mat-tab>
  
    <mat-tab label="Terminées ({{getCompletedCount()}})">
      <div class="map-container">
        <google-map
          #completedMap
          height="100vh"
          width="100%"
          [center]="center"
          [zoom]="zoom">
        </google-map>
      </div>
    </mat-tab>
  
    <mat-tab label="Annulées ({{getCanceledCount()}})">
      <div class="map-container">
        <google-map
          #canceledMap
          height="100vh"
          width="100%"
          [center]="center"
          [zoom]="zoom">
        </google-map>
      </div>
    </mat-tab>
  </mat-tab-group>
