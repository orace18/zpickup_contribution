<div class="chat-container">
  <!-- Chat Header -->
  <div class="chat-header">
    <div class="user-info">
      <div class="user-details">
        <div class="user-name">{{ conversationTitle }}</div>
        <div class="user-status">
          <span class="status-indicator" [ngClass]="{'online': contactIsOnline}"></span>
          <span class="status-text">{{ contactStatus }}</span>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <button class="action-button">
        <i class="bi bi-three-dots"></i>
      </button>
    </div>
  </div>

  <!-- Separator -->
  <div class="separator"></div>

  <!-- Message List -->
  <div class="message-list" #scrollContainer>
    <ng-container *ngFor="let message of messages; let i = index">
      <!-- Date Separator -->
      <div class="message-date-separator" *ngIf="isFirstMessageOfDate(i)">
        {{ getMessageDate(message) }}
      </div>

      <div class="message-row" [ngClass]="message.sender.userId === userId ? 'own-message' : 'other-message'">
        <!-- Avatar for non-admin messages -->
        <div class="avatar-container" *ngIf="message.sender?.userId !== userId">
          <!-- <ng-container *ngIf="message.sender?.avatar; else initialAvatar">
            <img [src]="message.sender.avatar" class="avatar" alt="Contact avatar">
          </ng-container> -->
          <ng-template #initialAvatar>
            <div class="initial-avatar">
              {{ getInitials(message.sender.name || '') }}
            </div>
          </ng-template>
        </div>

        <div class="message-container">
          <!-- Sender name for non-admin messages -->
          <div class="message-header" *ngIf="message.sender?.userId !== userId">
            <span class="sender-name">{{ message.sender.name }}</span>
          </div>

          <!-- <div class="message-bubble">
            <div class="message-content">
              
              
           
              <ng-container *ngIf="message.mediaType === 'image' || message.imageUrl || (message.content && isImageUrl(message.content))">
                <img 
                  [src]="message.imageUrl || (message.content?.startsWith('http') ? message.content : imageURI + message.content)" 
                  class="message-image" 
                  alt="Image"
                  (load)="scrollContainer.scrollTop = scrollContainer.scrollHeight"
                >
              </ng-container>
           
              <ng-container *ngIf="message.mediaType === 'video' || message.videoUrl || (message.content && isVideoUrl(message.content))">

                    type="video/mp4"
                  >
                  Votre navigateur ne prend pas en charge la lecture vidéo.
                </video>
              </ng-container>
              
              
              <ng-container *ngIf="message.mediaType === 'audio' || message.audioUrl || (message.content && isAudioUrl(message.content))">

                  <source 
                    [src]="message.audioUrl || (message.content?.startsWith('http') ? message.content : imageURI + message.content)" 
                    type="audio/mpeg"
                  >
                  Votre navigateur ne prend pas en charge la lecture audio.
                </audio>
              </ng-container>
              
              
              <ng-container *ngIf="message.content && !message.mediaType && !message.imageUrl && !message.videoUrl && !message.audioUrl && !isImageUrl(message.content) && !isVideoUrl(message.content) && !isAudioUrl(message.content)">
                {{ message.content }}
              </ng-container>
            </div>
          </div> -->


          <div class="message-bubble">
            <div class="message-content">
              <!-- Gestion conditionnelle du contenu basée sur mediaType -->

              <!-- Image -->
              <ng-container *ngIf="message.mediaType === 'image'">
                <div class="media-container">
                  <img [src]="getMediaUrl(message)" class="message-image" alt="Image"
                    (load)="scrollContainer.scrollTop = scrollContainer.scrollHeight">
                  <a [href]="getMediaUrl(message)" download class="download-button">Télécharger</a>
                </div>
              </ng-container>

              <!-- Vidéo -->
              <ng-container *ngIf="message.mediaType === 'video'">
                <div class="media-container">
                  <video controls class="message-video"
                    (loadeddata)="scrollContainer.scrollTop = scrollContainer.scrollHeight">
                    <source [src]="getMediaUrl(message)" type="video/mp4">
                   
                  </video>
                  <a [href]="getMediaUrl(message)" download class="download-button">Télécharger</a>
                </div>
              </ng-container>

              <!-- Audio -->
              <ng-container *ngIf="message.mediaType === 'audio'">
                <audio controls class="message-audio"
                  (loadeddata)="scrollContainer.scrollTop = scrollContainer.scrollHeight">
                  <source [src]="getMediaUrl(message)" type="audio/mpeg">
                  Votre navigateur ne prend pas en charge la lecture audio.
                </audio>
              </ng-container>

              <!-- Texte (seulement si ce n'est pas un média) -->
              <ng-container
                *ngIf="message.mediaType !== 'image' && message.mediaType !== 'video' && message.mediaType !== 'audio'">
                {{ message.content }}
              </ng-container>
            </div>
          </div>

          <!-- Message timestamp -->
          <div class="message-footer">
            <span class="message-time">{{ message.timestamp | date:'shortTime' }}</span>
          </div>
        </div>
      </div>
    </ng-container>

    <!-- Loading indicator -->
    <div class="loading-indicator" *ngIf="loading">
      <div class="spinner"></div>
    </div>

    <!-- Error message -->
    <div class="error-message" *ngIf="error">{{ error }}</div>
  </div>

  <!-- Message Composer -->
  <div class="message-composer">
    <!-- Hidden file input for media upload -->
    <input type="file" #mediaUpload (change)="handleMediaSelect($event)" style="display: none;" />

    <!-- Media buttons -->
    <div class="media-buttons">
      <button class="action-button" (click)="triggerMediaUpload('image')" title="Ajouter une image">
        <i class="bi bi-image" style="color: #796ce7;"></i>
      </button>
      <button class="action-button" (click)="triggerMediaUpload('video')" title="Ajouter une vidéo">
        <i class="bi bi-camera-video" style="color: #796ce7;"></i>
      </button>
      <button class="action-button" (click)="triggerMediaUpload('audio')" title="Ajouter un audio">
        <i class="bi bi-mic" style="color: #796ce7;"></i>
      </button>
    </div>

    <!-- Selected media preview -->
    <div class="selected-media-preview" *ngIf="selectedMedia">
      <div class="preview-container">
        <!-- Image preview -->
        <img *ngIf="selectedMediaType === 'image'" [src]="selectedMediaPreview" alt="Image à envoyer"
          class="preview-image">

        <!-- Video preview -->
        <div *ngIf="selectedMediaType === 'video'" class="media-preview">
          <i class="bi bi-camera-video-fill"></i>
          <span class="media-filename">{{ selectedMedia.name }}</span>
        </div>

        <!-- Audio preview -->
        <div *ngIf="selectedMediaType === 'audio'" class="media-preview">
          <i class="bi bi-file-music-fill"></i>
          <span class="media-filename">{{ selectedMedia.name }}</span>
        </div>

        <button class="remove-media-btn" (click)="removeSelectedMedia()">
          <i class="bi bi-x-circle-fill"></i>
        </button>
      </div>
    </div>

    <div class="composer-input-container">
      <textarea class="composer-input" [(ngModel)]="newMessage" (input)="autoResize($event)" [disabled]="loading"
        rows="1" placeholder="Écrivez un message..." (keydown.enter)="$event.preventDefault(); send()">
      </textarea>
    </div>

    <!-- Send button -->
    <button class="send-button" [disabled]="loading || (!newMessage.trim() && !selectedMedia)" (click)="send()"
      title="Envoyer">
      <i class="bi bi-send-fill"></i>
    </button>
  </div>
</div>
