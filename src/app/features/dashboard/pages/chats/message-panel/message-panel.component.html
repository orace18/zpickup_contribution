<div class="chat-container">
  <!-- Chat Header -->
  <div class="chat-header">
    <div class="user-info">
      <div class="user-details">
        <div class="user-name">{{ conversationTitle }}</div>
        <div class="user-status">
          <span class="status-indicator" [ngClass]="{'online': contactIsOnline}"></span>
          <span class="status-text">{{ contactStatus }}</span>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <button class="action-button">
        <i class="bi bi-three-dots"></i>
      </button>
    </div>
  </div>

  <!-- Separator -->
  <div class="separator"></div>

  <!-- Message List -->
  <div class="message-list" #scrollContainer>
    <ng-container *ngFor="let message of messages; let i = index">
      <!-- Date Separator -->
      <div class="message-date-separator" *ngIf="isFirstMessageOfDate(i)">
        {{ getMessageDate(message) }}
      </div>

      <div class="message-row" [ngClass]="isAdmin(message.sender.user_type) ? 'own-message' : 'other-message'">
        <!-- Avatar for non-admin messages -->
        <div class="avatar-container" *ngIf="!isAdmin(message.sender.user_type)">
          <ng-container *ngIf="message.sender.avatar; else initialAvatar">
            <img [src]="message.sender.avatar" class="avatar" alt="Contact avatar">
          </ng-container>
          <ng-template #initialAvatar>
            <div class="initial-avatar">
              {{ getInitials(creatorNames[message.sender.userId]) }}
            </div>
          </ng-template>
        </div>

        <div class="message-container">
          <!-- Sender name for non-admin messages -->
          <div class="message-header" *ngIf="!isAdmin(message.sender.user_type)">
            <span class="sender-name">{{ message.sender.name }}</span>
          </div>

          <div class="message-bubble">
            <div class="message-content">
              <!-- Check if content is an image URL -->
              <ng-container *ngIf="message.content && isImageUrl(message.content); else textContent">
                <img [src]="imageURI + message.content" class="message-image" alt="Uploaded image">
              </ng-container>
              <ng-template #textContent>
                {{ message.content }}
              </ng-template>
            </div>
            <!-- Display additional image if present -->
            <img *ngIf="message.imageUrl" [src]="message.imageUrl" class="message-image" alt="Message image">
          </div>

          <!-- Message timestamp -->
          <div class="message-footer">
            <span class="message-time">{{ message.timestamp | date:'shortTime' }}</span>
          </div>
        </div>
      </div>
    </ng-container>

    <!-- Error message -->
    <div class="error-message" *ngIf="error">{{ error }}</div>
  </div>

  <!-- Message Composer -->
  <div class="message-composer">
    <!-- Hidden file input for image upload -->
    <input type="file" id="imageUpload" (change)="handleImageSelect($event)" accept="image/*" style="display: none;" />

    <!-- Image upload button -->
    <button class="action-button file-button" (click)="triggerFileInput()" title="Add Image">
      <i class="bi bi-image" style="color: #FFF;"></i>
    </button>

    <!-- Selected image preview -->
    <div class="selected-image-preview" *ngIf="selectedImage">
      <div class="preview-container">
        <img [src]="selectedImagePreview" alt="Image to send" class="preview-image">
        <button class="remove-image-btn" (click)="removeSelectedImage()">
          <i class="bi bi-x-circle-fill"></i>
        </button>
      </div>
    </div>

    <div class="composer-input-container">
      <textarea 
        class="composer-input" 
        [(ngModel)]="newMessage" 
        (input)="autoResize($event)" 
        [disabled]="loading"
        rows="1" 
        placeholder="Type a message">
      </textarea>
    </div>

    <!-- Send button -->
    <button 
      class="send-button" 
      [disabled]="loading || (!newMessage.trim() && !selectedImage)" 
      (click)="send()"
      title="Send">
      <i class="bi bi-send-fill"></i>
    </button>
  </div>
</div>
