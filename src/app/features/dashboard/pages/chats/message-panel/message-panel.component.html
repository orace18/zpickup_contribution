<div class="chat-container">
  <!-- En-tête avec le nom et statut du contact -->
  <div class="chat-header">
    <div class="user-info">
      <div class="user-details">
        <div class="user-name">{{ conversationTitle }}</div>
        <div class="user-status">
          <span class="status-indicator" [ngClass]="{'online': contactIsOnline}"></span>
          <span class="status-text">{{ contactStatus }}</span>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <button class="action-button">
        <i class="bi bi-three-dots"></i>
      </button>
    </div>
  </div>

  <!-- Séparateur -->
  <div class="separator"></div>

  <!-- Zone de messages scrollable -->
  <div class="message-list" #scrollContainer>
    <ng-container *ngFor="let message of messages; let i = index">
      <!-- Séparateur de date si nécessaire -->
      <div class="message-date-separator" *ngIf="isFirstMessageOfDate(i)">
        {{ getMessageDate(message) }}
      </div>

      <div class="message-row" [ngClass]="isAdmin(message.sender.user_type) ? 'own-message' : 'other-message'">
        <!-- Avatar pour les messages d'utilisateurs non-admin -->
        <div class="avatar-container" *ngIf="!isAdmin(message.sender.user_type)">
          <ng-container *ngIf="message.sender.avatar; else initialAvatar">
            <img [src]="message.sender.avatar" class="avatar" alt="Contact avatar">
          </ng-container>
          <ng-template #initialAvatar>
            <div class="initial-avatar" >
              {{ getInitials(creatorNames[message.sender.userId]) }}
            </div>
          </ng-template>
        </div>

        <div class="message-container">
          <!-- Info expéditeur (uniquement pour les messages reçus des non-admin) -->
          <div class="message-header" *ngIf="!isAdmin(message.sender.user_type)">
            <span class="sender-name">{{ message.sender.name }}</span>
          </div>

          <!-- Contenu du message -->
          <div class="message-bubble">
            <div class="message-content">{{ message.content }}</div>
            <!-- Affichage de l'image si présente -->
            <img *ngIf="message.imageUrl" [src]="message.imageUrl" class="message-image" alt="Message image">
          </div>

          <!-- Horodatage (pour tous les messages) -->
          <div class="message-footer">
            <span class="message-time">{{ message.timestamp | date:'shortTime' }}</span>
          </div>
        </div>
      </div>
    </ng-container>

    <!-- Message d'erreur -->
    <div class="error-message" *ngIf="error">{{ error }}</div>
  </div>

  <!-- Zone de saisie de message améliorée -->
  <div class="message-composer">
    <!-- Input de fichier caché pour sélectionner les images -->
    <input 
      type="file" 
      id="imageUpload" 
      (change)="handleImageSelect($event)" 
      accept="image/*" 
      style="display: none;" />
    
    <!-- Bouton pour sélectionner une image -->
    <button class="action-button file-button" (click)="triggerFileInput()" title="Ajouter une image">
      <i class="bi bi-image style='color: #FFF;'"></i>
    </button>
    
    <!-- Bouton pour autres pièces jointes -->
    <!-- <button class="action-button" title="Ajouter une pièce jointe">
      <i class="bi bi-paperclip"></i>
    </button> -->

    <!-- Conteneur d'aperçu d'image sélectionnée -->
    <div class="selected-image-preview" *ngIf="selectedImage">
      <div class="preview-container">
        <img [src]="selectedImagePreview" alt="Image à envoyer" class="preview-image">
        <button class="remove-image-btn" (click)="removeSelectedImage()">
          <i class="bi bi-x-circle-fill"></i>
        </button>
      </div>
    </div>

    <div class="composer-input-container">
      <textarea
        class="composer-input"
        [(ngModel)]="newMessage"
        (input)="autoResize($event)"
        [disabled]="loading"
        rows="1"
        placeholder="Tapez un message"></textarea>
    </div>

    <!-- Bouton d'envoi amélioré -->
    <button 
      class="send-button" 
      [disabled]="loading || (!newMessage.trim() && !selectedImage)" 
      (click)="send()" 
      title="Envoyer">
      <i class="bi bi-send-fill"></i>
    </button>
  </div>
</div>
