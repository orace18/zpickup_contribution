<div class="chat-container">
  <!-- En-tête avec le nom et statut du contact -->
  <div class="chat-header">
    <div class="user-info">
<!--       <img [src]="contactAvatar" class="user-avatar" alt="User avatar" />
 -->      <div class="user-details">
        <div class="user-name">{{ conversationTitle }}</div>
        <div class="user-status">
          <span class="status-indicator" [ngClass]="{'online': contactIsOnline}"></span>
          <span class="status-text">{{ contactStatus }}</span>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <button class="action-button">
        <i class="bi bi-three-dots"></i>
      </button>
    </div>
  </div>

  <!-- Séparateur -->
  <div class="separator"></div>

  <!-- Zone de messages scrollable -->
  <div class="message-list" #scrollContainer>
    <ng-container *ngFor="let message of messages; let i = index">
      <!-- Séparateur de date si nécessaire -->
      <div class="message-date-separator" *ngIf="isFirstMessageOfDate(i)">
        {{ getMessageDate(message) }}
      </div>

      <div class="message-row" [ngClass]="isAdmin(message.sender.user_type) ? 'own-message' : 'other-message'">
        <!-- Avatar pour les messages d'utilisateurs non-admin -->
        <div class="avatar-container" *ngIf="!isAdmin(message.sender.user_type)">
          <!-- <img [src]="message.sender.avatar || '/assets/avatar-placeholder.png'" class="avatar" alt="Avatar"> -->
          <ng-container *ngIf="message.sender.avatar; else initialAvatar">
            <img [src]="message.sender.avatar" class="avatar" alt="Contact avatar">
          </ng-container>
          <ng-template #initialAvatar>
            <div class="initial-avatar" >
              {{ getInitials(creatorNames[message.sender.userId]) }}
            </div>
          </ng-template>
        </div>

        <div class="message-container">
          <!-- Info expéditeur (uniquement pour les messages reçus des non-admin) -->
          <div class="message-header" *ngIf="!isAdmin(message.sender.user_type)">
            <span class="sender-name">{{ message.sender.name }}</span>
<!--             <span class="message-time">{{ message.timestamp | date:'shortTime' }}</span>
 -->          </div>

          <!-- Contenu du message -->
          <div class="message-bubble">
            <div class="message-content">{{ message.content }}</div>
          </div>

          <!-- Horodatage (pour tous les messages) -->
          <div class="message-footer">
            <span class="message-time">{{ message.timestamp | date:'shortTime' }}</span>
          </div>
        </div>
      </div>
    </ng-container>

    <!-- Message d'erreur -->
    <div class="error-message" *ngIf="error">{{ error }}</div>
  </div>

  <!-- Zone de saisie de message -->
  <div class="message-composer">
<!--     <button class="action-button">
      <i class="bi bi-paperclip"></i>
    </button>

    <button class="action-button">
      <i class="bi bi-arrow-up-square"></i>
    </button> -->

    <div class="composer-input-container">
      <textarea
        class="composer-input"
        [(ngModel)]="newMessage"
        (input)="autoResize($event)"
        [disabled]="loading"
        rows="1"
        placeholder="Type a message"></textarea>
    </div>

    <button class="send-button" [disabled]="loading || !newMessage.trim()" (click)="send()">
      Envoyer
      <!-- <i class="ki-duotone ki-send fs-2">
        <span class="path1"></span>
        <span class="path2"></span>
      </i> -->
    </button>
  </div>
</div>
